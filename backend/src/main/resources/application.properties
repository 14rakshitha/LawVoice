spring.application.name=lawvoice-backend
server.port=${PORT:8081}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/lawvoice?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
